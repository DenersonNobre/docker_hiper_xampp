name: Build and Push Docker Image

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_HUB_USERNAME }}/super-xampp
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{ branch == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ meta.outputs.tags }}
          labels: ${{ meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Pull image
        run: |
          echo ${{ secrets.DOCKER_HUB_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/super-xampp:latest

      - name: Run container
        run: |
          docker run -d --name test-app -p 8080:80 ${{ secrets.DOCKER_HUB_USERNAME }}/super-xampp:latest
          sleep 30

      - name: Test Apache
        run: curl -f http://localhost:8080/ || exit 1

      - name: Test PHPMyAdmin
        run: curl -f http://localhost:8080/phpmyadmin/ || exit 1

      - name: Test Node.js
        run: curl -f http://localhost:3000/api/status || exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f test-app